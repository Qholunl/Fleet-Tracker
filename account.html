<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akun | Fleet Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        /* ===== Gaya Dasar (dipertahankan) ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #07080f;
            color: #f0f2fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            animation: pageFadeIn 0.6s ease forwards;
        }
        @keyframes pageFadeIn {
            0% { opacity: 0; transform: translateY(18px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 24px;
            animation: containerSlide 0.5s ease forwards;
        }
        @keyframes containerSlide {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #fff 60%, #667eea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header h1 i {
            -webkit-text-fill-color: #667eea;
            background: none;
        }
        .header .back-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            color: inherit;
            padding: 8px 16px;
            cursor: pointer;
            transition: background 0.25s, transform 0.15s;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header .back-btn:hover {
            background: rgba(255,255,255,0.14);
            transform: scale(1.02);
        }

        /* ===== Card ===== */
        .card {
            background: rgba(26, 30, 50, 0.55);
            backdrop-filter: blur(28px) saturate(1.1);
            -webkit-backdrop-filter: blur(28px) saturate(1.1);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.03);
            background-image: linear-gradient(135deg, rgba(255,255,255,0.02) 0%, transparent 50%);
            transition: box-shadow 0.3s ease, border-color 0.3s ease;
            animation: cardSlide 0.5s ease forwards;
            animation-delay: 0.1s;
            opacity: 0;
        }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }
        .card:nth-child(4) { animation-delay: 0.35s; }

        @keyframes cardSlide {
            0% { opacity: 0; transform: translateY(16px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .card:hover {
            border-color: rgba(102, 126, 234, 0.15);
            box-shadow: 0 20px 56px rgba(0,0,0,0.55), 0 0 0 1px rgba(102, 126, 234, 0.05);
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #a0aec0;
        }
        .card-title i { color: #667eea; }
        .card-title .title-actions {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-title .title-actions .refresh-btn {
            background: rgba(255,255,255,0.04);
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8892a8;
            cursor: pointer;
            transition: background 0.2s, transform 0.3s, color 0.2s;
            font-size: 0.8rem;
        }
        .card-title .title-actions .refresh-btn:hover {
            background: rgba(102, 126, 234, 0.15);
            color: #667eea;
            transform: rotate(60deg);
        }
        .card-title .title-actions .refresh-btn:active {
            transform: rotate(120deg);
        }

        /* ===== Profil ===== */
        .profile-row {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .profile-row:last-child { border-bottom: none; }
        .profile-row .label {
            min-width: 120px;
            font-weight: 500;
            color: #a0aec0;
            font-size: 0.85rem;
        }
        .profile-row .value {
            font-weight: 500;
            font-size: 0.95rem;
            word-break: break-all;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .profile-row .value .copy-btn {
            background: rgba(255,255,255,0.04);
            border: none;
            border-radius: 6px;
            padding: 2px 8px;
            color: #667eea;
            font-size: 0.7rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .profile-row .value .copy-btn:hover {
            background: rgba(102, 126, 234, 0.15);
            transform: scale(1.05);
        }
        .profile-row .value .copy-btn:active {
            transform: scale(0.95);
        }

        /* ===== Device List ===== */
        .device-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .device-list::-webkit-scrollbar { width: 4px; }
        .device-list::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); border-radius: 4px; }
        .device-list::-webkit-scrollbar-thumb { background: rgba(102, 126, 234, 0.35); border-radius: 4px; }
        .device-list::-webkit-scrollbar-thumb:hover { background: rgba(102, 126, 234, 0.5); }

        .device-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s ease, border-color 0.25s ease, box-shadow 0.25s ease;
            cursor: default;
        }
        .device-item:hover {
            transform: translateX(4px);
            border-color: rgba(102, 126, 234, 0.2);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.04);
            background: rgba(255,255,255,0.05);
        }
        .device-item .name { font-weight: 500; }
        .device-item .id { font-size: 0.7rem; color: #8892a8; }
        .device-item .status {
            font-size: 0.7rem;
            padding: 3px 12px 3px 28px;
            border-radius: 40px;
            background: rgba(74, 222, 128, 0.12);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.15);
            position: relative;
            display: inline-flex;
            align-items: center;
        }
        .device-item .status::before {
            content: '';
            position: absolute;
            left: 10px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse-dot 1.8s ease-in-out infinite;
            box-shadow: 0 0 6px rgba(74, 222, 128, 0.4);
        }
        .device-item .status.offline {
            background: rgba(248, 113, 113, 0.12);
            color: #f87171;
            border-color: rgba(248, 113, 113, 0.15);
        }
        .device-item .status.offline::before {
            background: #f87171;
            animation: pulse-dot-offline 2s ease-in-out infinite;
            box-shadow: 0 0 6px rgba(248, 113, 113, 0.3);
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.75); }
        }
        @keyframes pulse-dot-offline {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 0.2; transform: scale(0.6); }
        }

        /* ===== Skeleton ===== */
        .skeleton-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 52px;
            overflow: hidden;
            position: relative;
        }
        .skeleton-item::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 200%;
            height: 100%;
            background: linear-gradient(90deg, transparent 25%, rgba(255,255,255,0.04) 50%, transparent 75%);
            animation: shimmer 1.6s ease-in-out infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-50%); }
            100% { transform: translateX(50%); }
        }
        .skeleton-item .skeleton-line {
            height: 12px;
            border-radius: 6px;
            background: rgba(255,255,255,0.05);
        }
        .skeleton-item .skeleton-line.short { width: 60px; }
        .skeleton-item .skeleton-line.long { width: 140px; }
        .skeleton-item .skeleton-line.badge { width: 70px; height: 22px; border-radius: 40px; }

        /* ===== Error / Retry ===== */
        .device-error {
            text-align: center;
            padding: 24px 16px;
            color: #f87171;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .device-error .retry-btn {
            background: rgba(248, 113, 113, 0.12);
            border: 1px solid rgba(248, 113, 113, 0.2);
            border-radius: 8px;
            padding: 8px 20px;
            color: #f87171;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
        }
        .device-error .retry-btn:hover {
            background: rgba(248, 113, 113, 0.2);
            transform: scale(1.04);
        }

        /* ===== Actions ===== */
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 8px;
        }
        .actions .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: opacity 0.25s, transform 0.15s, box-shadow 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.06);
            color: inherit;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .actions .btn:hover {
            opacity: 0.85;
            transform: scale(1.03);
        }
        .actions .btn:active { transform: scale(0.97); }
        .actions .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.2);
        }
        .actions .btn-primary:hover {
            box-shadow: 0 6px 24px rgba(102, 126, 234, 0.3);
        }
        .actions .btn-danger {
            background: linear-gradient(135deg, #f87171, #ef4444);
            color: #fff;
            border: none;
            box-shadow: 0 4px 16px rgba(248, 113, 113, 0.15);
        }
        .actions .btn-danger:hover {
            box-shadow: 0 6px 24px rgba(248, 113, 113, 0.25);
        }
        .actions .btn-outline {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.12);
        }
        .actions .btn-outline:hover {
            background: rgba(255,255,255,0.04);
        }

        /* ===== Toast ===== */
        #alertToast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 14px 22px;
            border-radius: 14px;
            z-index: 2000;
            max-width: 90%;
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: 0 16px 48px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.06);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: none;
            align-items: center;
            gap: 12px;
            animation: toastSlide 0.35s ease forwards;
            background: rgba(26, 30, 50, 0.92);
            color: #f0f2fa;
        }
        #alertToast .toast-icon { font-size: 1.1rem; flex-shrink: 0; }
        #alertToast.success {
            border-color: rgba(74, 222, 128, 0.25);
        }
        #alertToast.success .toast-icon { color: #4ade80; }
        #alertToast.danger {
            border-color: rgba(248, 113, 113, 0.25);
        }
        #alertToast.danger .toast-icon { color: #f87171; }

        @keyframes toastSlide {
            0% { opacity: 0; transform: translateY(20px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ===== Modal ===== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            padding: 20px;
            animation: fadeIn 0.25s ease;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: rgba(26, 30, 50, 0.96);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            max-width: 480px;
            width: 100%;
            padding: 28px 24px 24px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.6);
            animation: slideUp 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-header h2 {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal-header h2 i { color: #667eea; }
        .modal-close {
            background: rgba(255,255,255,0.06);
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8892a8;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
        }
        .modal-close:hover {
            background: rgba(255,255,255,0.12);
            color: #fff;
            transform: rotate(90deg);
        }
        .modal-body { margin-bottom: 24px; }
        .modal-body .form-group { margin-bottom: 16px; }
        .modal-body .form-group label {
            display: block;
            font-weight: 500;
            font-size: 0.85rem;
            color: #a0aec0;
            margin-bottom: 6px;
        }
        .modal-body .form-group input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: #f0f2fa;
            font-size: 0.95rem;
            font-family: inherit;
            transition: border 0.2s, box-shadow 0.2s;
        }
        .modal-body .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.25);
        }
        .modal-body .form-group input::placeholder { color: #5a6580; }
        .modal-footer {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .modal-footer .btn {
            padding: 10px 24px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: opacity 0.25s, transform 0.15s;
        }
        .modal-footer .btn:hover {
            opacity: 0.85;
            transform: scale(1.02);
        }
        .modal-footer .btn-secondary {
            background: rgba(255,255,255,0.06);
            color: #a0aec0;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .modal-footer .btn-secondary:hover {
            background: rgba(255,255,255,0.1);
        }
        .modal-footer .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
        }
        .modal-footer .btn-danger {
            background: linear-gradient(135deg, #f87171, #ef4444);
            color: #fff;
            border: none;
        }
        .modal-footer .btn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .text-danger {
            color: #f87171;
            font-size: 0.8rem;
            margin-top: 4px;
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== Responsif ===== */
        @media (max-width: 640px) {
            .profile-row { flex-wrap: wrap; gap: 4px; }
            .profile-row .label { min-width: 100%; }
            .profile-row .value { width: 100%; }

            .actions .btn { width: 100%; justify-content: center; }
            .actions .btn-danger {
                margin-top: 8px;
                border-top: 1px solid rgba(255,255,255,0.06);
                padding-top: 14px;
                border-radius: 0;
                background: transparent;
                box-shadow: none;
                color: #f87171;
                border-bottom: 1px solid rgba(255,255,255,0.06);
                border-left: none;
                border-right: none;
                border-top: 1px solid rgba(255,255,255,0.06);
                border-radius: 0;
            }
            .actions .btn-danger:hover {
                background: rgba(248, 113, 113, 0.06);
                box-shadow: none;
            }

            .header { flex-wrap: wrap; gap: 12px; }
            .card { padding: 16px; }
            .modal-box { padding: 20px 16px; }
            .modal-footer { flex-direction: column; }
            .modal-footer .btn { width: 100%; justify-content: center; }

            #alertToast {
                bottom: auto;
                top: 16px;
                right: 16px;
                left: 16px;
                max-width: 100%;
                border-radius: 12px;
                padding: 12px 16px;
                font-size: 0.8rem;
            }
        }

        @media (max-width: 480px) {
            .device-list { max-height: 280px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1><i class="fas fa-user-circle"></i> Akun</h1>
            <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i> Kembali</button>
        </div>

        <!-- Informasi Profil -->
        <div class="card">
            <div class="card-title"><i class="fas fa-id-card"></i> Informasi Profil</div>
            <div id="profileContent">
                <div class="profile-row">
                    <span class="label">Nama</span>
                    <span class="value" id="displayName">-</span>
                </div>
                <div class="profile-row">
                    <span class="label">Email</span>
                    <span class="value" id="displayEmail">-</span>
                </div>
                <div class="profile-row">
                    <span class="label">Username</span>
                    <span class="value" id="displayUsername">-</span>
                </div>
                <div class="profile-row">
                    <span class="label">ID Pengguna</span>
                    <span class="value" id="displayUserId">
                        -
                        <button class="copy-btn" onclick="copyUserId()" title="Salin ID">
                            <i class="fas fa-copy"></i> Salin
                        </button>
                    </span>
                </div>
                <div class="profile-row">
                    <span class="label">Terdaftar Sejak</span>
                    <span class="value" id="displayCreatedAt">-</span>
                </div>
            </div>
        </div>

        <!-- Daftar Perangkat -->
        <div class="card">
            <div class="card-title">
                <i class="fas fa-microchip"></i> Perangkat Saya
                <span class="title-actions">
                    <button class="refresh-btn" onclick="refreshDevices()" title="Refresh daftar perangkat">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </span>
            </div>
            <div id="deviceListContainer">
                <div id="deviceList" class="device-list">
                    <!-- Skeleton akan di-render oleh JS -->
                </div>
            </div>
        </div>

        <!-- Tindakan Akun -->
        <div class="card">
            <div class="card-title"><i class="fas fa-cog"></i> Manajemen Akun</div>
            <div class="actions">
                <button class="btn btn-primary" onclick="openEditProfile()"><i class="fas fa-user-edit"></i> Edit Profil</button>
                <button class="btn btn-outline" onclick="openChangePassword()"><i class="fas fa-key"></i> Ganti Password</button>
                <button class="btn btn-danger" onclick="openLogoutConfirm()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
    </div>

    <!-- ===== MODAL EDIT PROFIL ===== -->
    <div class="modal-overlay" id="modalEditProfile">
        <div class="modal-box">
            <div class="modal-header">
                <h2><i class="fas fa-user-edit"></i> Edit Profil</h2>
                <button class="modal-close" onclick="closeModal('modalEditProfile')"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="editName">Nama Lengkap</label>
                    <input type="text" id="editName" placeholder="Masukkan nama lengkap" />
                    <span class="text-danger" id="editNameError"></span>
                </div>
                <div class="form-group">
                    <label for="editEmail">Email</label>
                    <input type="email" id="editEmail" placeholder="Masukkan alamat email" />
                    <span class="text-danger" id="editEmailError"></span>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('modalEditProfile')">Batal</button>
                <button class="btn btn-primary" id="saveProfileBtn">Simpan Perubahan</button>
            </div>
        </div>
    </div>

    <!-- ===== MODAL GANTI PASSWORD ===== -->
    <div class="modal-overlay" id="modalChangePassword">
        <div class="modal-box">
            <div class="modal-header">
                <h2><i class="fas fa-key"></i> Ganti Password</h2>
                <button class="modal-close" onclick="closeModal('modalChangePassword')"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="currentPassword">Password Saat Ini</label>
                    <input type="password" id="currentPassword" placeholder="Masukkan password saat ini" />
                    <span class="text-danger" id="currentPasswordError"></span>
                </div>
                <div class="form-group">
                    <label for="newPassword">Password Baru</label>
                    <input type="password" id="newPassword" placeholder="Minimal 6 karakter" />
                    <span class="text-danger" id="newPasswordError"></span>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Konfirmasi Password Baru</label>
                    <input type="password" id="confirmPassword" placeholder="Ulangi password baru" />
                    <span class="text-danger" id="confirmPasswordError"></span>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('modalChangePassword')">Batal</button>
                <button class="btn btn-primary" id="savePasswordBtn">Simpan Password</button>
            </div>
        </div>
    </div>

    <!-- ===== MODAL KONFIRMASI LOGOUT ===== -->
    <div class="modal-overlay" id="modalLogoutConfirm">
        <div class="modal-box" style="max-width:400px;">
            <div class="modal-header">
                <h2><i class="fas fa-sign-out-alt" style="color:#f87171;"></i> Konfirmasi Logout</h2>
                <button class="modal-close" onclick="closeModal('modalLogoutConfirm')"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" style="text-align:center;padding:8px 0 16px;">
                <p style="color:#a0aec0;font-size:0.95rem;line-height:1.6;">
                    Apakah Anda yakin ingin keluar dari akun ini?
                </p>
            </div>
            <div class="modal-footer" style="justify-content:center;">
                <button class="btn btn-secondary" onclick="closeModal('modalLogoutConfirm')">Batal</button>
                <button class="btn btn-danger" id="confirmLogoutBtn">Ya, Logout</button>
            </div>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div id="alertToast" role="alert" aria-live="polite">
        <span class="toast-icon"></span>
        <span class="toast-message"></span>
    </div>

    <!-- ===== SUPABASE CLIENT (via CDN) ===== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js">
    </script>

    <script>
        // ================================================================
        //  KONFIGURASI SUPABASE
        //  Ganti dengan URL dan anon key project Anda
        // ================================================================
        const SUPABASE_URL = 'https://YOUR_PROJECT.supabase.co';
        const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const STORAGE_CURRENT_USER = 'fleet_current_user';

        // ================================================================
        //  TOAST
        // ================================================================
        function showAlert(msg, type = 'danger') {
            const toast = document.getElementById('alertToast');
            const icon = toast.querySelector('.toast-icon');
            const message = toast.querySelector('.toast-message');
            message.textContent = msg;
            if (type === 'success') {
                icon.innerHTML = '<i class="fas fa-check-circle"></i>';
                toast.className = 'success';
            } else if (type === 'danger') {
                icon.innerHTML = '<i class="fas fa-exclamation-circle"></i>';
                toast.className = 'danger';
            } else {
                icon.innerHTML = '<i class="fas fa-info-circle"></i>';
                toast.className = '';
            }
            toast.style.display = 'flex';
            clearTimeout(toast._hide);
            toast._hide = setTimeout(() => { toast.style.display = 'none'; }, 4000);
        }

        // ================================================================
        //  NAVIGASI
        // ================================================================
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'dashboard.html';
            }
        }

        // ================================================================
        //  USER DATA
        // ================================================================
        function getUserData() {
            const userStr = localStorage.getItem(STORAGE_CURRENT_USER);
            if (!userStr) {
                window.location.href = 'index.html';
                return null;
            }
            try {
                return JSON.parse(userStr);
            } catch {
                window.location.href = 'index.html';
                return null;
            }
        }

        function saveUserData(user) {
            localStorage.setItem(STORAGE_CURRENT_USER, JSON.stringify(user));
        }

        // ================================================================
        //  RENDER PROFIL (dari Supabase)
        // ================================================================
        async function renderProfile() {
            const user = getUserData();
            if (!user) return;

            try {
                // Ambil data dari tabel profiles berdasarkan user_id
                const { data: profile, error } = await supabase
                    .from('profiles')
                    .select('name, username, email, created_at')
                    .eq('user_id', user.id)
                    .single();

                if (error) throw error;

                document.getElementById('displayName').textContent = profile.name || '-';
                document.getElementById('displayEmail').textContent = profile.email || user.email || '-';
                document.getElementById('displayUsername').textContent = profile.username || '-';
                document.getElementById('displayUserId').innerHTML = `
                    ${user.id || '-'}
                    <button class="copy-btn" onclick="copyUserId()" title="Salin ID">
                        <i class="fas fa-copy"></i> Salin
                    </button>
                `;

                if (profile.created_at) {
                    const date = new Date(profile.created_at);
                    const formatter = new Intl.DateTimeFormat('id-ID', {
                        day: 'numeric',
                        month: 'long',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit',
                        timeZone: 'Asia/Jakarta',
                        timeZoneName: 'short'
                    });
                    document.getElementById('displayCreatedAt').textContent = formatter.format(date);
                } else {
                    document.getElementById('displayCreatedAt').textContent = '-';
                }

                // Simpan data ke localStorage agar konsisten
                saveUserData({ ...user, name: profile.name, username: profile.username, email: profile.email });

            } catch (err) {
                console.error('Error fetch profile:', err);
                showAlert('Gagal memuat profil: ' + err.message, 'danger');
            }
        }

        // ================================================================
        //  COPY USER ID
        // ================================================================
        function copyUserId() {
            const user = getUserData();
            if (!user || !user.id) return;
            navigator.clipboard.writeText(user.id).then(() => {
                showAlert('ID Berhasil Disalin!', 'success');
            }).catch(() => {
                const el = document.createElement('textarea');
                el.value = user.id;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                showAlert('ID Berhasil Disalin!', 'success');
            });
        }

        // ================================================================
        //  LOAD DEVICES (dari tabel devices)
        // ================================================================
        async function loadDevices() {
            const container = document.getElementById('deviceList');
            const user = getUserData();
            if (!user) return;

            // Tampilkan skeleton
            container.innerHTML = `
                <div class="skeleton-item"><div class="skeleton-line long"></div><div class="skeleton-line badge"></div></div>
                <div class="skeleton-item"><div class="skeleton-line long"></div><div class="skeleton-line badge"></div></div>
                <div class="skeleton-item"><div class="skeleton-line long"></div><div class="skeleton-line badge"></div></div>
                <div class="skeleton-item"><div class="skeleton-line long"></div><div class="skeleton-line badge"></div></div>
            `;

            try {
                const { data: devices, error } = await supabase
                    .from('devices')
                    .select('id, name, status')
                    .eq('user_id', user.id)
                    .order('created_at', { ascending: true });

                if (error) throw error;

                if (!devices || devices.length === 0) {
                    container.innerHTML = '<div style="text-align:center;padding:20px;color:#8892a8;">Belum ada perangkat terdaftar.</div>';
                    return;
                }

                let html = '';
                devices.forEach(d => {
                    const statusClass = d.status === 'online' ? '' : 'offline';
                    const statusText = d.status === 'online' ? 'Online' : 'Offline';
                    html += `<div class="device-item">
                                <div>
                                    <div class="name"><i class="fas fa-car"></i> ${d.name || d.id}</div>
                                    <div class="id">ID: ${d.id}</div>
                                </div>
                                <span class="status ${statusClass}">${statusText}</span>
                            </div>`;
                });
                container.innerHTML = html;

            } catch (e) {
                console.warn('loadDevices error:', e);
                container.innerHTML = `
                    <div class="device-error">
                        <i class="fas fa-exclamation-triangle" style="font-size:1.6rem;"></i>
                        <span>${e.message || 'Gagal memuat perangkat.'}</span>
                        <button class="retry-btn" onclick="loadDevices()">
                            <i class="fas fa-sync-alt"></i> Coba Lagi
                        </button>
                    </div>
                `;
            }
        }

        // ================================================================
        //  REFRESH DEVICES
        // ================================================================
        function refreshDevices() {
            const btn = document.querySelector('.refresh-btn i');
            btn.classList.add('fa-spin');
            loadDevices().finally(() => {
                btn.classList.remove('fa-spin');
            });
        }

        // ================================================================
        //  MODAL HELPERS
        // ================================================================
        function openModal(modalId) {
            document.getElementById(modalId).classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
            document.body.style.overflow = '';
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.querySelectorAll('input').forEach(inp => inp.value = '');
                modal.querySelectorAll('.text-danger').forEach(el => el.textContent = '');
            }
        }

        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', function(e) {
                if (e.target === this) closeModal(this.id);
            });
        });

        // ================================================================
        //  EDIT PROFIL
        // ================================================================
        function openEditProfile() {
            const user = getUserData();
            if (!user) return;
            // Isi form dengan data dari profile yang sudah di-render
            document.getElementById('editName').value = document.getElementById('displayName').textContent;
            document.getElementById('editEmail').value = document.getElementById('displayEmail').textContent;
            document.getElementById('editNameError').textContent = '';
            document.getElementById('editEmailError').textContent = '';
            openModal('modalEditProfile');
        }

        document.getElementById('saveProfileBtn').addEventListener('click', async function() {
            const user = getUserData();
            if (!user) return;

            const name = document.getElementById('editName').value.trim();
            const email = document.getElementById('editEmail').value.trim();
            let valid = true;

            if (!name) {
                document.getElementById('editNameError').textContent = 'Nama lengkap wajib diisi.';
                valid = false;
            } else {
                document.getElementById('editNameError').textContent = '';
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email || !emailRegex.test(email)) {
                document.getElementById('editEmailError').textContent = 'Masukkan alamat email yang valid.';
                valid = false;
            } else {
                document.getElementById('editEmailError').textContent = '';
            }

            if (!valid) return;

            try {
                const { error } = await supabase
                    .from('profiles')
                    .update({ name, email })
                    .eq('user_id', user.id);

                if (error) throw error;

                // Update localStorage
                user.name = name;
                user.email = email;
                saveUserData(user);

                // Re-render profile
                await renderProfile();
                closeModal('modalEditProfile');
                showAlert('Profil berhasil diperbarui.', 'success');

            } catch (err) {
                showAlert('Gagal update profil: ' + err.message, 'danger');
            }
        });

        // ================================================================
        //  GANTI PASSWORD (via Supabase Auth)
        // ================================================================
        function openChangePassword() {
            document.querySelectorAll('#modalChangePassword input').forEach(inp => inp.value = '');
            document.querySelectorAll('#modalChangePassword .text-danger').forEach(el => el.textContent = '');
            openModal('modalChangePassword');
        }

        document.getElementById('savePasswordBtn').addEventListener('click', async function() {
            const current = document.getElementById('currentPassword').value;
            const newPass = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            let valid = true;

            if (current.length < 6) {
                document.getElementById('currentPasswordError').textContent = 'Password saat ini tidak boleh kosong.';
                valid = false;
            } else {
                document.getElementById('currentPasswordError').textContent = '';
            }

            if (newPass.length < 6) {
                document.getElementById('newPasswordError').textContent = 'Password baru minimal 6 karakter.';
                valid = false;
            } else {
                document.getElementById('newPasswordError').textContent = '';
            }

            if (newPass !== confirm) {
                document.getElementById('confirmPasswordError').textContent = 'Konfirmasi password tidak cocok.';
                valid = false;
            } else {
                document.getElementById('confirmPasswordError').textContent = '';
            }

            if (!valid) return;

            try {
                // Supabase Auth: ganti password
                const { error } = await supabase.auth.updateUser({
                    password: newPass
                });

                if (error) throw error;

                closeModal('modalChangePassword');
                showAlert('Password berhasil diganti.', 'success');

            } catch (err) {
                showAlert('Gagal mengganti password: ' + err.message, 'danger');
            }
        });

        // ================================================================
        //  LOGOUT (dengan Supabase)
        // ================================================================
        function openLogoutConfirm() {
            openModal('modalLogoutConfirm');
        }

        document.getElementById('confirmLogoutBtn').addEventListener('click', async function() {
            closeModal('modalLogoutConfirm');
            await supabase.auth.signOut();
            localStorage.removeItem(STORAGE_CURRENT_USER);
            window.location.href = 'index.html';
        });

        // ================================================================
        //  INIT
        // ================================================================
        document.addEventListener('DOMContentLoaded', async () => {
            const user = getUserData();
            if (!user) return;

            // Cek session di Supabase (validasi token)
            const { data: { session }, error } = await supabase.auth.getSession();
            if (error || !session) {
                // Session tidak valid, logout
                localStorage.removeItem(STORAGE_CURRENT_USER);
                window.location.href = 'index.html';
                return;
            }

            await renderProfile();
            await loadDevices();
        });
    </script>
</body>
</html>
