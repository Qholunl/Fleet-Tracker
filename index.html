    <style>
        /* ===== CSS Variables (Theme) ===== */

            --bg-primary: #07080f;
            --bg-sidebar: rgba(12, 14, 28, 0.85);
            --glass-border: 1px solid rgba(255, 255, 255, 0.06);
            --glass-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
            --text-primary: #f0f2fa;
            --text-muted: #8892a8;

        body.light-theme {

<body>
    <!-- ===== SIDEBAR & MAIN CONTENT ===== -->

    <script>
        // ================================================================
        //  KONFIGURASI SUPABASE (dari Environment Variables Netlify)
        // ================================================================
        // Di Netlify, set SUPABASE_URL dan SUPABASE_ANON_KEY di Environment Variables
        // atau gunakan nilai default untuk development lokal.
        const SUPABASE_URL = window.SUPABASE_URL || 'https://gapcqlcqowmhcpzbqygr.supabase.co';
        const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || 'sb_secret_ruYKHGf-xjO-hGnGaM8JsA_fQ2c53TD';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ================================================================
        //  KONFIGURASI HIVEMQ (MQTT) — siap pakai jika diperlukan
        // ================================================================
        // const HIVEMQ_URL = window.HIVEMQ_URL || 'wss://your-broker.hivemq.cloud:8884/mqtt';
        // const HIVEMQ_USER = window.HIVEMQ_USER || '';
        // const HIVEMQ_PASS = window.HIVEMQ_PASS || '';

        // ================================================================
        //  KONFIGURASI UMUM
        // ================================================================
        const WA_NUMBER = '6285646839016';
        let currentLanguage = 'id';
        let isMuted = false;
        let speedLimit = 80;
        let isKillSwitchMode = false;

        // ================================================================
        //  MULTI-BAHASA (translations tetap sama)
        // ================================================================
        const translations = { /* ... (sama seperti sebelumnya) */ };
        function t(key) { return translations[currentLanguage]?.[key] || translations.id[key] || key; }
        function changeLanguage(lang) { /* ... */ }

        // ================================================================
        //  TOGGLE SIDEBAR & ACCORDION (sama)
        // ================================================================
        // ...

        // ================================================================
        //  AUTH & STORAGE
        // ================================================================
        const STORAGE_CURRENT_USER = 'fleet_current_user';
        const STORAGE_PREFIX = 'fleet_user_';
        let currentUser = null;

        function getUserStorageKey(baseKey) {
            return `${STORAGE_PREFIX}${currentUser.id}_${baseKey}`;
        }

        function checkAuth() {
            const u = localStorage.getItem(STORAGE_CURRENT_USER);
            if (!u) { window.location.href = 'index.html'; return false; }
            currentUser = JSON.parse(u);
            document.getElementById('userName').textContent = currentUser.name || currentUser.username;
            return true;
        }

        function logout() {
            localStorage.removeItem(STORAGE_CURRENT_USER);
            // Hapus juga session supabase jika perlu
            supabase.auth.signOut().catch(() => {});
            window.location.href = 'index.html';
        }

        // ================================================================
        //  DEVICE MANAGEMENT (dengan Supabase) — PERBAIKAN
        // ================================================================
        let devicesData = [];
        let currentDevice = null;
        let currentMarker = null;
        let vehicleIcon;
        let deviceSolenoidStatus = new Map();
        let deviceInfoMap = new Map();

        async function loadUserDevices() {
            const container = document.getElementById('deviceList');
            container.innerHTML =
                `<div class="skeleton-item"><div class="skeleton-line"></div><div class="skeleton-line"></div></div>
                          <div class="skeleton-item"><div class="skeleton-line"></div><div class="skeleton-line"></div></div>
                          <div class="skeleton-item"><div class="skeleton-line"></div><div class="skeleton-line"></div></div>`;

            try {
                const { data, error } = await supabase
                    .from('devices')
                    .select('id, name, status, solenoid_state, last_lat, last_lng, last_speed, last_fuel, last_engine_status, last_data_time')
                    .eq('user_id', currentUser.id)
                    .order('name');

                if (error) throw error;

                devicesData = data.map(d => ({ id: d.id, name: d.name }));
                // Perbarui info tambahan
                data.forEach(d => {
                    deviceInfoMap.set(d.id, {
                        status: d.status || 'offline',
                        lastUpdate: d.last_data_time ? new Date(d.last_data_time).toLocaleString() : '-',
                        speed: d.last_speed || 0,
                        fuel: d.last_fuel || 0,
                        engine: d.last_engine_status || 0,
                        solenoid: d.solenoid_state || false,
                        lat: d.last_lat,
                        lng: d.last_lng,
                        lastDataTime: d.last_data_time ? new Date(d.last_data_time).getTime() : 0
                    });
                    deviceSolenoidStatus.set(d.id, d.solenoid_state || false);
                });

                renderDeviceList();
                const lastId = localStorage.getItem('fleet_last_device');
                if (lastId && devicesData.some(d => d.id === lastId)) {
                    selectDevice(lastId);
                } else if (devicesData.length > 0) {
                    selectDevice(devicesData[0].id);
                } else {
                    resetTelemetryUI();
                    stopPolling();
                }
            } catch (e) {
                console.error('Gagal load devices:', e);
                showAlert('Gagal memuat daftar perangkat', 'danger');
                container.innerHTML = '<div style="text-align:center;padding:12px;font-size:0.75rem;">Gagal memuat perangkat</div>';
            }
        }

        async function addUserDevice(id, name) {
            try {
                const { error } = await supabase
                    .from('devices')
                    .insert([{
                        id: id,
                        user_id: currentUser.id,
                        name: name,
                        status: 'offline'
                    }]);

                if (error) {
                    if (error.code === '23505') {
                        showAlert('Perangkat dengan ID ini sudah ada!', 'danger');
                    } else {
                        showAlert('Gagal menambahkan perangkat: ' + error.message, 'danger');
                    }
                    return false;
                }
                await loadUserDevices();
                return true;
            } catch (e) {
                showAlert('Gagal menambahkan perangkat', 'danger');
                return false;
            }
        }

        async function deleteUserDevice(deviceId) {
            try {
                const { error } = await supabase
                    .from('devices')
                    .delete()
                    .eq('id', deviceId)
                    .eq('user_id', currentUser.id);

                if (error) throw error;

                deviceSolenoidStatus.delete(deviceId);
                deviceInfoMap.delete(deviceId);
                if (currentDevice && currentDevice.id === deviceId) {
                    if (currentMarker) map.removeLayer(currentMarker);
                    currentMarker = null;
                    currentDevice = null;
                    stopPolling();
                    resetTelemetryUI();
                }
                await loadUserDevices();
                if (devicesData.length > 0) selectDevice(devicesData[0].id);
                showAlert(`Perangkat ${deviceId} dihapus`, 'success');
            } catch (e) {
                showAlert('Gagal menghapus perangkat: ' + e.message, 'danger');
            }
        }

        // ================================================================
        //  POLLING REAL-TIME (dari Supabase) — bisa diganti dengan MQTT
        // ================================================================
        let pollingInterval = null;
        let pollingTimeout = null;

        function stopPolling() {
            if (pollingInterval) clearInterval(pollingInterval);
            if (pollingTimeout) clearTimeout(pollingTimeout);
            pollingInterval = null;
            pollingTimeout = null;
        }

        function startPolling(deviceId) {
            stopPolling();
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const lastUpdateText = document.getElementById('lastUpdateText');

            async function doPoll() {
                if (pollingTimeout) clearTimeout(pollingTimeout);
                statusDot.className = 'dot connecting';
                statusText.textContent = 'CONNECTING';

                try {
                    const { data, error } = await supabase
                        .from('devices')
                        .select('*')
                        .eq('id', deviceId)
                        .eq('user_id', currentUser.id)
                        .single();

                    if (error) throw error;

                    statusDot.className = 'dot online';
                    statusText.textContent = 'ONLINE';
                    const now = new Date().toLocaleTimeString();
                    lastUpdateText.textContent = `Last update: ${now}`;

                    if (data) {
                        deviceInfoMap.set(deviceId, {
                            status: data.status || 'online',
                            lastUpdate: data.last_data_time ? new Date(data.last_data_time).toLocaleString() : now,
                            speed: data.last_speed || 0,
                            fuel: data.last_fuel || 0,
                            engine: data.last_engine_status || 0,
                            solenoid: data.solenoid_state || false,
                            lat: data.last_lat,
                            lng: data.last_lng,
                            lastDataTime: data.last_data_time ? new Date(data.last_data_time).getTime() : Date.now()
                        });
                        deviceSolenoidStatus.set(deviceId, data.solenoid_state || false);
                    }

                    if (currentDevice && deviceInfoMap.has(deviceId)) {
                        const info = deviceInfoMap.get(deviceId);
                        if (info.lastDataTime && (Date.now() - info.lastDataTime) > 30000) {
                            statusDot.className = 'dot warning';
                            statusText.textContent = '⚠️ DATA LOST';
                        }
                        updateTelemetryUI(info);
                        updateMarkerPosition(info);
                        checkSpeeding(info.speed || 0);
                    }

                    // Jadwalkan polling berikutnya (interval adaptif)
                    const interval = 3000;
                    pollingTimeout = setTimeout(doPoll, interval);

                } catch (e) {
                    statusDot.className = 'dot offline';
                    statusText.textContent = 'OFFLINE';
                    lastUpdateText.textContent = 'Last update: --';
                    pollingTimeout = setTimeout(doPoll, 5000);
                }
            }
            doPoll();
        }

        // Fungsi pembantu untuk update UI telemetri
        function updateTelemetryUI(info) {
            document.getElementById('speedValue').textContent = `${info.speed||0} km/h`;
            document.getElementById('fuelConsumptionValue').textContent = `0 L`; // Belum ada data konsumsi
            document.getElementById('engineStatusValue').textContent = info.engine == 1 ? 'HIDUP' : 'MATI';

            if (info.fuel !== undefined) {
                const fuel = Math.min(100, Math.max(0, info.fuel));
                document.getElementById('fuelLevel').textContent = `${fuel.toFixed(1)}%`;
                document.getElementById('fuelProgressFill').style.width = `${fuel}%`;
                const cls = fuel < 20 ? 'low' : (fuel < 50 ? 'medium' : 'high');
                document.getElementById('fuelProgressFill').className = 'fuel-progress-fill ' + cls;
            }

            const isOn = info.solenoid || false;
            const el = document.getElementById('solenoidStatus');
            el.textContent = isOn ? 'SOL: ON' : 'SOL: OFF';
            el.className = 'card-value ' + (isKillSwitchMode ? (isOn ? 'red' : 'green') : (isOn ? 'green' : 'red'));
        }

        function updateMarkerPosition(info) {
            if (info.lat && info.lng) {
                const coords = [info.lat, info.lng];
                if (!currentMarker) {
                    currentMarker = L.marker(coords, { icon: vehicleIcon }).addTo(map);
                    currentMarker.bindPopup(`<b>${currentDevice.name}</b><br>Speed: ${info.speed||0} km/h`);
                } else {
                    currentMarker.setLatLng(coords);
                }
                map.setView(coords, 14);
                checkZoneStatus(info.lat, info.lng, currentDevice.id);
            }
        }

        // ================================================================
        //  SELECT DEVICE
        // ================================================================
        function selectDevice(deviceId) {
            if (currentMarker) map.removeLayer(currentMarker);
            currentMarker = null;
            currentDevice = devicesData.find(d => d.id == deviceId);
            if (!currentDevice) return;
            localStorage.setItem('fleet_last_device', deviceId);

            const info = deviceInfoMap.get(deviceId);
            if (info && info.lat && info.lng) {
                const coords = [info.lat, info.lng];
                currentMarker = L.marker(coords, { icon: vehicleIcon }).addTo(map);
                currentMarker.bindPopup(`<b>${currentDevice.name}</b>`).openPopup();
                map.flyTo(coords, 14, { duration: 1.5 });
                checkZoneStatus(info.lat, info.lng, deviceId);
            } else {
                resetTelemetryUI();
            }

            startPolling(deviceId);
            renderDeviceList();
            if (window.innerWidth <= 820) toggleSidebar();
        }

        // ================================================================
        //  SOLENOID CONTROL (Update ke Supabase)
        // ================================================================
        async function sendSolenoidCommand(deviceId, activate) {
            if (!confirm(`Kirim perintah SOLENOID ${activate ? 'AKTIF' : 'NONAKTIF'} ke ${deviceId}?`)) return;

            try {
                const { error } = await supabase
                    .from('devices')
                    .update({ solenoid_state: activate })
                    .eq('id', deviceId)
                    .eq('user_id', currentUser.id);

                if (error) throw error;

                deviceSolenoidStatus.set(deviceId, activate);
                showAlert(`Perintah solenoid ${activate ? 'AKTIF' : 'NONAKTIF'} dikirim ke ${deviceId}`, 'success');
                renderDeviceList();
                document.getElementById('solenoidStatus').textContent = activate ? 'SOL: ON' : 'SOL: OFF';
            } catch (e) {
                showAlert('Gagal mengirim perintah: ' + e.message, 'danger');
            }
        }

        // ================================================================
        //  GEOFENCE (dengan Supabase)
        // ================================================================
        let geofencePolygons = [];
        let drawControl = null;

        async function saveAllGeofencesToStorage() {
            const geofencesData = geofencePolygons.map((p, idx) => ({
                user_id: currentUser.id,
                name: p.options.zoneName || 'Zona',
                coordinates: p.getLatLngs()[0].map(ll => ({ lat: ll.lat, lng: ll.lng })),
                type: p.options.type || 'polygon'
            }));

            if (geofencesData.length === 0) {
                showAlert('Tidak ada geofence untuk disimpan', 'warning');
                return;
            }

            try {
                // Hapus semua geofence user dulu (sederhana)
                await supabase.from('geofences').delete().eq('user_id', currentUser.id);
                // Insert baru
                const { error } = await supabase.from('geofences').insert(geofencesData);
                if (error) throw error;

                loadSavedGeofenceList();
                showAlert('Geofence tersimpan ke server', 'success');
            } catch (e) {
                showAlert('Gagal simpan geofence: ' + e.message, 'danger');
            }
        }

        // Fungsi syncGeofencesToServer sekarang memanggil saveAllGeofencesToStorage
        async function syncGeofencesToServer() {
            await saveAllGeofencesToStorage();
        }

        // ... (fungsi geofence lainnya seperti loadGeofencesFromStorage, loadSavedGeofenceList, dll. sama seperti sebelumnya)

        // ================================================================
        //  ESP32 CODE MODAL & EXPORT (tidak diubah)
        // ================================================================
        // ...

        // ================================================================
        //  INIT MAP & LAYER
        // ================================================================
        let map, currentTileLayer;

        function initMap() {
            map = L.map('map', {
                center: [-6.2088, 106.8456],
                zoom: 13,
                zoomControl: true,
                fadeAnimation: true,
                zoomAnimation: true,
                markerZoomAnimation: true
            });
            const savedLayer = localStorage.getItem('fleet_tile_layer') || 'osm';
            currentTileLayer = tileLayers[savedLayer];
            currentTileLayer.addTo(map);
            // ... (sama)
            vehicleIcon = L.icon({
                iconUrl: 'https://cdn-icons-png.flaticon.com/512/744/744465.png',
                iconSize: [35, 35],
                iconAnchor: [17, 17]
            });
            setTimeout(() => { map.invalidateSize(); }, 100);
        }

        // ================================================================
        //  ALERTS: SPEEDING & GEOFENCE
        // ================================================================
        function checkSpeeding(speed) {
            if (speed > speedLimit) {
                showAlert(`⚠️ ${t('speeding_alert')} (${speed} km/h)`);
                playBeep(1000, 200);
            }
        }

        // ================================================================
        //  TOAST, AUDIO, FULLSCREEN (sama)
        // ================================================================
        // ...

        // ================================================================
        //  INIT
        // ================================================================
        async function init() {
            try {
                // Muat preferensi
                const savedLang = localStorage.getItem('fleet_language') || 'id';
                document.getElementById('langSelect').value = savedLang;
                changeLanguage(savedLang);
                isMuted = localStorage.getItem('fleet_muted') === 'true';
                if (isMuted) document.getElementById('muteBtn').classList.add('muted');

                const savedSpeed = localStorage.getItem('fleet_speed_limit');
                if (savedSpeed) { speedLimit = Number(savedSpeed);
                    document.getElementById('speedLimitSlider').value = speedLimit;
                    document.getElementById('speedLimitDisplay').textContent = speedLimit; }
                isKillSwitchMode = localStorage.getItem('fleet_kill_switch_mode') === 'true';
                if (isKillSwitchMode) document.getElementById('killSwitchToggle').classList.add('active');

                if (!checkAuth()) return;
                initializeSidebar();

                initMap();
                await loadUserDevices();
                await loadGeofencesFromStorage();
                initGeofence();
                initLocationButton();
                initBottomPanelSwipe();

                // Generate MAC otomatis
                document.getElementById('newDeviceId').value = generateRandomMAC();
                document.getElementById('generateMacBtn').addEventListener('click', fillRandomMAC);

                // Event listeners untuk tambah perangkat
                document.getElementById('newDeviceName').addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        const macInput = document.getElementById('newDeviceId');
                        if (!macInput.value.trim()) macInput.value = generateRandomMAC();
                        addESP32Device();
                    }
                });
                document.getElementById('newDeviceId').addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        addESP32Device();
                    }
                });

                document.getElementById('searchDevice').addEventListener('input', renderDeviceList);
                document.getElementById('confirmDeleteYesBtn').onclick = confirmDeleteDevice;
                document.getElementById('confirmDeleteNoBtn').onclick = closeDeleteModal;

                const theme = localStorage.getItem('fleet_theme');
                if (theme === 'light') document.body.classList.add('light-theme');

                // ================================================================
                //  INTEGRASI MQTT (HiveMQ) — Siap Aktifkan
                //  Jika ingin mengganti polling dengan MQTT, aktifkan blok di bawah
                // ================================================================
                /*
                if (HIVEMQ_URL && HIVEMQ_USER && HIVEMQ_PASS) {
                    const mqtt = window.mqtt;
                    const client = mqtt.connect(HIVEMQ_URL, {
                        username: HIVEMQ_USER,
                        password: HIVEMQ_PASS
                    });
                    client.on('connect', () => {
                        console.log('Connected to HiveMQ');
                        client.subscribe(`devices/${currentUser.id}/#`);
                    });
                    client.on('message', (topic, message) => {
                        const payload = JSON.parse(message.toString());
                        const deviceId = payload.device_id;
                        if (deviceId && deviceInfoMap.has(deviceId)) {
                            const info = deviceInfoMap.get(deviceId);
                            Object.assign(info, payload);
                            deviceInfoMap.set(deviceId, info);
                            if (currentDevice && currentDevice.id === deviceId) {
                                updateTelemetryUI(info);
                                updateMarkerPosition(info);
                                checkSpeeding(info.speed || 0);
                            }
                        }
                    });
                    client.on('error', (err) => console.warn('MQTT error:', err));
                    // Nonaktifkan polling jika MQTT aktif
                    // stopPolling();
                }
                */

                // Perbaikan ukuran map
                setTimeout(() => { if (map) map.invalidateSize(); }, 600);
                window.addEventListener('resize', () => setTimeout(() => { if (map) map.invalidateSize(); }, 300));
                window.addEventListener('orientationchange', () => setTimeout(() => { if (map) map.invalidateSize(); }, 500));

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') { closeDeleteModal();
                        closeESP32Modal(); }
                    if (e.ctrlKey && e.shiftKey && e.key === 'M') { e.preventDefault();
                        toggleSidebar(); }
                });

            } catch (e) {
                console.error('Init error:', e);
                showAlert('Terjadi error saat inisialisasi');
            }
        }

        document.addEventListener('DOMContentLoaded', init);
        console.log('🚀 Fleet Tracker Dashboard — Supabase Ready');
        console.log('📡 Supabase URL:', SUPABASE_URL);
    </script>
