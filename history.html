<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fleet Tracker — Riwayat Perjalanan</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #07080f;
            color: #f0f2fa;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .header-left h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 60%, #667eea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header-left p {
            color: #8892a8;
            font-size: 0.85rem;
            margin-top: 4px;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .header-actions select,
        .header-actions input[type="date"] {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 10px 14px;
            color: #fff;
            font-weight: 500;
            outline: none;
            cursor: pointer;
            font-size: 0.85rem;
            min-width: 140px;
        }
        .header-actions select option,
        .header-actions input[type="date"] option {
            background: #1a1a2e;
        }
        .header-actions input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
        }
        .btn-action {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 10px 18px;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s, transform 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            border: none;
            font-family: 'Inter', sans-serif;
        }
        .btn-action:hover {
            background: rgba(255,255,255,0.12);
            transform: translateY(-2px);
        }
        .btn-action.primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-color: transparent;
        }
        .btn-action.primary:hover { opacity: 0.9; }
        .btn-action.filter {
            background: #667eea;
            border-color: transparent;
        }
        .btn-action.filter:hover { opacity: 0.85; }
        .btn-action.danger:hover {
            background: rgba(248,113,113,0.2);
            border-color: rgba(248,113,113,0.3);
        }
        .btn-action.export {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            border-color: transparent;
            color: #1a1a2e;
        }
        .btn-action.export:hover { opacity: 0.85; }
        .btn-action.analytics {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-color: transparent;
            color: #1a1a2e;
        }
        .btn-action.analytics:hover { opacity: 0.85; }

        /* MAIN LAYOUT: 2 kolom (peta + tabel) */
        .history-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .history-map {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            overflow: hidden;
            height: 600px;
            position: relative;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        .history-list {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 16px;
            max-height: 600px;
            overflow-y: auto;
        }
        .history-list h3 {
            font-size: 0.9rem;
            font-weight: 600;
            color: #8892a8;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            position: sticky;
            top: 0;
            background: #07080f;
            padding-bottom: 8px;
            z-index: 2;
        }
        .trip-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
        }
        .trip-item:hover {
            background: rgba(255,255,255,0.07);
            transform: translateX(4px);
        }
        .trip-item.active {
            border-color: #667eea;
            background: rgba(102,126,234,0.12);
        }
        .trip-item .trip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .trip-item .trip-title {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .trip-item .trip-time {
            font-size: 0.7rem;
            color: #8892a8;
        }
        .trip-item .trip-stats {
            display: flex;
            gap: 14px;
            margin-top: 6px;
            font-size: 0.7rem;
            color: #8892a8;
            flex-wrap: wrap;
        }
        .trip-item .trip-stats span i {
            margin-right: 4px;
            width: 14px;
        }
        .trip-item .trip-stats .highlight {
            color: #4ade80;
        }
        .empty-state {
            text-align: center;
            color: #8892a8;
            padding: 40px 0;
            font-size: 0.9rem;
        }

        /* LOADING OVERLAY */
        .loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 16px;
        }
        .loading-overlay.active { display: flex; }
        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-overlay p {
            color: #8892a8;
            font-weight: 500;
            font-size: 0.9rem;
        }

        /* TOAST */
        #alertToast {
            display: none;
            position: fixed;
            bottom: 100px;
            right: 24px;
            background: #f87171;
            color: #fff;
            padding: 12px 20px;
            border-radius: 14px;
            z-index: 2000;
            max-width: 90%;
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
        }
        #alertToast.success { background: #4ade80; color: #1a1a2e; }
        #alertToast.warning { background: #fbbf24; color: #1a1a2e; }

        /* Responsive */
        @media (max-width: 992px) {
            .history-layout {
                grid-template-columns: 1fr;
            }
            .history-map {
                height: 400px;
            }
            .history-list {
                max-height: 400px;
            }
        }
        @media (max-width: 768px) {
            .header { flex-direction: column; align-items: start; }
            .header-actions { width: 100%; justify-content: flex-start; }
            .header-actions select,
            .header-actions input[type="date"] { min-width: 120px; flex: 1; }
        }
        @media (max-width: 480px) {
            body { padding: 12px; }
            .header-left h1 { font-size: 1.2rem; }
            .btn-action { font-size: 0.7rem; padding: 8px 12px; }
            .history-map { height: 280px; }
            .history-list { max-height: 300px; padding: 10px; }
            .trip-item { padding: 10px 12px; }
            .trip-item .trip-stats { font-size: 0.6rem; gap: 8px; }
        }
    </style>
</head>
<body>

<!-- LOADING -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <p>Memuat data perjalanan...</p>
</div>

<!-- TOAST -->
<div id="alertToast"></div>

<div class="container">
    <!-- HEADER -->
    <div class="header">
        <div class="header-left">
            <h1><i class="fas fa-map-marked-alt" style="-webkit-text-fill-color:#667eea;"></i> Riwayat Perjalanan</h1>
            <p>Pilih perangkat &amp; tanggal untuk melihat rute dan detail perjalanan</p>
        </div>
        <div class="header-actions">
            <select id="deviceSelect">
                <option value="">Pilih Perangkat...</option>
            </select>
            <input type="date" id="startDate" />
            <span style="color:#8892a8; font-size:0.8rem;">s/d</span>
            <input type="date" id="endDate" />
            <button class="btn-action filter" onclick="loadHistory()">
                <i class="fas fa-search"></i> Tampilkan
            </button>
            <!-- Link ke halaman lain -->
            <a href="export.html" class="btn-action export">
                <i class="fas fa-file-download"></i> Ekspor
            </a>
            <a href="analytics.html" class="btn-action analytics">
                <i class="fas fa-chart-pie"></i> Analitik
            </a>
            <a href="dashboard.html" class="btn-action primary">
                <i class="fas fa-arrow-left"></i> Dashboard
            </a>
            <button class="btn-action danger" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </div>

    <!-- LAYOUT: PETA + LIST -->
    <div class="history-layout">
        <!-- PETA -->
        <div class="history-map">
            <div id="map"></div>
        </div>
        <!-- LIST PERJALANAN -->
        <div class="history-list" id="historyList">
            <h3><i class="fas fa-list-ul"></i> Daftar Perjalanan</h3>
            <div id="tripContainer">
                <div class="empty-state">Pilih perangkat dan tanggal, lalu klik Tampilkan</div>
            </div>
        </div>
    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// ================================================================
//  KONFIGURASI SUPABASE
// ================================================================
// Di Netlify, set SUPABASE_URL dan SUPABASE_ANON_KEY di Environment Variables
const SUPABASE_URL = window.SUPABASE_URL || 'https://your-project.supabase.co';
const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || 'your-anon-key';

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ================================================================
//  STORAGE & AUTH
// ================================================================
const STORAGE_KEY = 'fleet_current_user';

// ================================================================
//  CEK LOGIN
// ================================================================
const userData = localStorage.getItem(STORAGE_KEY);
if (!userData) {
    window.location.href = 'index.html';
    throw new Error('Unauthorized');
}
const currentUser = JSON.parse(userData);

// ================================================================
//  GLOBAL VARIABLES
// ================================================================
let map = null;
let tripMarkers = [];
let tripPolylines = [];
let currentTripData = [];
let selectedTripIndex = -1;

// ================================================================
//  FUNGSI UTILITY
// ================================================================
function logout() {
    localStorage.removeItem(STORAGE_KEY);
    window.location.href = 'index.html';
}

function showToast(msg, type = 'danger') {
    const toast = document.getElementById('alertToast');
    toast.textContent = msg;
    toast.className = type;
    toast.style.display = 'block';
    clearTimeout(toast._hide);
    toast._hide = setTimeout(() => { toast.style.display = 'none'; }, 4000);
}

function setLoading(active) {
    document.getElementById('loadingOverlay').classList.toggle('active', active);
}

// ================================================================
//  SET DEFAULT DATE (7 hari terakhir)
// ================================================================
function setDefaultDates() {
    const now = new Date();
    const end = now.toISOString().split('T')[0];
    const start = new Date(now);
    start.setDate(start.getDate() - 7);
    document.getElementById('startDate').value = start.toISOString().split('T')[0];
    document.getElementById('endDate').value = end;
}

// ================================================================
//  LOAD DEVICES (dari Supabase)
// ================================================================
async function loadDevices() {
    try {
        const { data, error } = await supabase
            .from('devices')
            .select('id, name')
            .eq('user_id', currentUser.id)
            .order('name');

        if (error) throw error;

        const sel = document.getElementById('deviceSelect');
        sel.innerHTML = '<option value="">Pilih Perangkat...</option>';
        if (data && data.length) {
            data.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d.id;
                opt.textContent = d.name + ' (' + d.id + ')';
                sel.appendChild(opt);
            });
            // Set default ke perangkat pertama
            sel.value = data[0]?.id || '';
        } else {
            sel.innerHTML += `<option value="" disabled>Tidak ada perangkat</option>`;
        }
    } catch (e) {
        console.warn('Gagal load devices:', e);
        showToast('Gagal memuat daftar perangkat', 'warning');
        const sel = document.getElementById('deviceSelect');
        sel.innerHTML = '<option value="">Pilih Perangkat...</option><option value="" disabled>Error load devices</option>';
    }
}

// ================================================================
//  INIT MAP
// ================================================================
function initMap() {
    map = L.map('map', {
        center: [-6.2088, 106.8456],
        zoom: 13,
        zoomControl: true,
    });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);
}

// ================================================================
//  LOAD HISTORY (dari Supabase)
// ================================================================
async function loadHistory() {
    const deviceId = document.getElementById('deviceSelect').value;
    const startDate = document.getElementById('startDate').value;
    const endDate = document.getElementById('endDate').value;

    if (!deviceId) {
        showToast('Pilih perangkat terlebih dahulu', 'warning');
        return;
    }
    if (!startDate || !endDate) {
        showToast('Pilih rentang tanggal', 'warning');
        return;
    }
    if (new Date(startDate) > new Date(endDate)) {
        showToast('Tanggal mulai tidak boleh lebih besar dari tanggal akhir', 'warning');
        return;
    }

    setLoading(true);
    try {
        // Query vehicle_data dari Supabase
        let query = supabase
            .from('vehicle_data')
            .select('*')
            .eq('device_id', deviceId)
            .gte('recorded_at', startDate)
            .lte('recorded_at', endDate + 'T23:59:59')
            .order('recorded_at', { ascending: true });

        const { data, error } = await query;

        if (error) throw error;

        if (!data || data.length === 0) {
            showToast('Tidak ada data perjalanan untuk rentang yang dipilih', 'warning');
            document.getElementById('tripContainer').innerHTML = '<div class="empty-state">Tidak ada perjalanan ditemukan</div>';
            clearMap();
            setLoading(false);
            return;
        }

        // Konversi data ke format yang digunakan oleh fungsi groupTrips
        const historyData = data.map(h => ({
            lat: h.lat || 0,
            lng: h.lng || 0,
            speed: h.speed || 0,
            flow_rate: h.flow_rate || 0,
            fuel_consumption: h.fuel_consumption || 0,
            engine_status: h.engine_status || 0,
            fuel: h.fuel_level || 100,
            timestamp: Math.floor(new Date(h.recorded_at).getTime() / 1000),
            recorded_at: h.recorded_at
        }));

        // Proses data menjadi trip (kelompokkan berdasarkan engine status)
        const trips = groupTrips(historyData);
        currentTripData = trips;
        renderTripList(trips);
        if (trips.length > 0) {
            renderTripOnMap(trips[0], 0);
            selectedTripIndex = 0;
        } else {
            clearMap();
            document.getElementById('tripContainer').innerHTML = '<div class="empty-state">Tidak ada perjalanan (semua data mesin mati)</div>';
        }
        showToast(`Menampilkan ${trips.length} perjalanan`, 'success');
    } catch (e) {
        console.error('Error load history:', e);
        showToast('Gagal memuat data: ' + e.message, 'danger');
        document.getElementById('tripContainer').innerHTML = '<div class="empty-state">Gagal memuat data perjalanan</div>';
        clearMap();
    } finally {
        setLoading(false);
    }
}

// ================================================================
//  GROUP TRIPS (kelompokkan berdasarkan engine status)
// ================================================================
function groupTrips(history) {
    const trips = [];
    let currentTrip = [];
    let inTrip = false;

    // Urutkan berdasarkan timestamp ascending
    const sorted = [...history].sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

    for (let i = 0; i < sorted.length; i++) {
        const point = sorted[i];
        const engine = point.engine_status || 0;
        if (engine === 1) {
            if (!inTrip) {
                inTrip = true;
                currentTrip = [point];
            } else {
                currentTrip.push(point);
            }
        } else {
            if (inTrip && currentTrip.length >= 2) {
                trips.push({ points: currentTrip });
                inTrip = false;
                currentTrip = [];
            } else if (inTrip) {
                // Terlalu pendek, abaikan
                inTrip = false;
                currentTrip = [];
            }
        }
    }
    if (inTrip && currentTrip.length >= 2) {
        trips.push({ points: currentTrip });
    }

    // Jika tidak ada trip yang terdeteksi tapi ada data, buat satu trip dari semua data
    if (trips.length === 0 && sorted.length >= 2) {
        const hasEngineOn = sorted.some(p => p.engine_status == 1);
        if (hasEngineOn) {
            const engineOnPoints = sorted.filter(p => p.engine_status == 1);
            if (engineOnPoints.length >= 2) {
                trips.push({ points: engineOnPoints });
            } else {
                trips.push({ points: sorted });
            }
        } else {
            trips.push({ points: sorted });
        }
    }

    // Hitung statistik per trip
    trips.forEach((trip, idx) => {
        const pts = trip.points;
        if (pts.length < 2) return;
        trip.startTime = pts[0].timestamp || 0;
        trip.endTime = pts[pts.length-1].timestamp || 0;
        trip.duration = (trip.endTime - trip.startTime) / 60;
        trip.startLat = pts[0].lat || 0;
        trip.startLng = pts[0].lng || 0;
        trip.endLat = pts[pts.length-1].lat || 0;
        trip.endLng = pts[pts.length-1].lng || 0;

        let dist = 0;
        for (let i = 1; i < pts.length; i++) {
            const p1 = pts[i-1];
            const p2 = pts[i];
            if (p1.lat && p1.lng && p2.lat && p2.lng) {
                dist += haversine(p1.lat, p1.lng, p2.lat, p2.lng);
            }
        }
        trip.distance = dist;

        const firstFuel = pts[0].fuel_consumption || 0;
        const lastFuel = pts[pts.length-1].fuel_consumption || 0;
        trip.fuelUsed = Math.abs(lastFuel - firstFuel);

        const totalSpeed = pts.reduce((sum, p) => sum + (p.speed || 0), 0);
        trip.avgSpeed = totalSpeed / pts.length;
        trip.maxSpeed = Math.max(...pts.map(p => p.speed || 0));

        trip.startTimeStr = trip.startTime ? new Date(trip.startTime * 1000).toLocaleString() : '-';
        trip.endTimeStr = trip.endTime ? new Date(trip.endTime * 1000).toLocaleString() : '-';
    });

    // Urutkan berdasarkan waktu mulai (terbaru dulu)
    trips.sort((a, b) => (b.startTime || 0) - (a.startTime || 0));

    // Beri nomor urut
    trips.forEach((trip, idx) => { trip.index = idx + 1; });

    return trips;
}

// ================================================================
//  HAVERSINE
// ================================================================
function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// ================================================================
//  RENDER TRIP LIST
// ================================================================
function renderTripList(trips) {
    const container = document.getElementById('tripContainer');
    if (!trips || trips.length === 0) {
        container.innerHTML = '<div class="empty-state">Tidak ada perjalanan ditemukan</div>';
        return;
    }

    let html = '';
    trips.forEach((trip, index) => {
        const isActive = (index === selectedTripIndex);
        const durMenit = Math.round(trip.duration || 0);
        const durDisplay = durMenit < 60 ? `${durMenit} menit` : `${(durMenit/60).toFixed(1)} jam`;
        html += `
            <div class="trip-item ${isActive ? 'active' : ''}" onclick="selectTrip(${index})">
                <div class="trip-header">
                    <span class="trip-title">🚗 Perjalanan ${trip.index || index + 1}</span>
                    <span class="trip-time">${trip.startTimeStr}</span>
                </div>
                <div class="trip-stats">
                    <span><i class="fas fa-route"></i> ${(trip.distance || 0).toFixed(2)} km</span>
                    <span><i class="fas fa-clock"></i> ${durDisplay}</span>
                    <span><i class="fas fa-gas-pump"></i> ${(trip.fuelUsed || 0).toFixed(2)} L</span>
                    <span><i class="fas fa-tachometer-alt"></i> ${(trip.avgSpeed || 0).toFixed(1)} km/h</span>
                    <span><i class="fas fa-bolt"></i> ${(trip.maxSpeed || 0).toFixed(1)} km/h</span>
                </div>
            </div>
        `;
    });
    container.innerHTML = html;
}

// ================================================================
//  SELECT TRIP
// ================================================================
function selectTrip(index) {
    if (index < 0 || index >= currentTripData.length) return;
    selectedTripIndex = index;
    const trip = currentTripData[index];
    renderTripList(currentTripData);
    renderTripOnMap(trip, index);
}

// ================================================================
//  RENDER TRIP ON MAP
// ================================================================
function renderTripOnMap(trip, index) {
    clearMap();

    const pts = trip.points;
    if (!pts || pts.length < 2) return;

    // Filter titik yang valid (punya lat/lng)
    const validPts = pts.filter(p => p.lat && p.lng && !isNaN(p.lat) && !isNaN(p.lng));
    if (validPts.length < 2) {
        showToast('Titik koordinat tidak valid untuk perjalanan ini', 'warning');
        return;
    }

    // Buat polyline
    const coords = validPts.map(p => [p.lat, p.lng]);
    const polyline = L.polyline(coords, {
        color: '#667eea',
        weight: 4,
        opacity: 0.8,
        smoothFactor: 1,
    }).addTo(map);
    tripPolylines.push(polyline);

    // Fit bounds
    map.fitBounds(polyline.getBounds(), { padding: [50, 50] });

    // Marker start
    const startIcon = L.icon({
        iconUrl: 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/images/marker-icon.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
    });
    const startMarker = L.marker([validPts[0].lat, validPts[0].lng], { icon: startIcon })
        .addTo(map)
        .bindPopup(`🏁 Start<br>${trip.startTimeStr || '-'}`);
    tripMarkers.push(startMarker);

    // Marker end
    const endIcon = L.icon({
        iconUrl: 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/images/marker-icon.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
    });
    const endMarker = L.marker([validPts[validPts.length-1].lat, validPts[validPts.length-1].lng], { icon: endIcon })
        .addTo(map)
        .bindPopup(`🏁 End<br>${trip.endTimeStr || '-'}`);
    tripMarkers.push(endMarker);

    // Titik kecepatan tertinggi
    let maxSpeedPt = validPts.reduce((a, b) => ((a.speed || 0) > (b.speed || 0) ? a : b), validPts[0]);
    if (maxSpeedPt.speed > 20) {
        const speedIcon = L.divIcon({
            html: `<div style="background:#fbbf24;color:#1a1a2e;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:11px;box-shadow:0 0 12px rgba(251,191,36,0.4);">⚡</div>`,
            className: '',
            iconSize: [28, 28]
        });
        L.marker([maxSpeedPt.lat, maxSpeedPt.lng], { icon: speedIcon })
            .addTo(map)
            .bindPopup(`⚡ Kecepatan tertinggi: ${maxSpeedPt.speed} km/h`);
    }
}

// ================================================================
//  CLEAR MAP
// ================================================================
function clearMap() {
    tripMarkers.forEach(m => { try { map.removeLayer(m); } catch(e) {} });
    tripPolylines.forEach(p => { try { map.removeLayer(p); } catch(e) {} });
    tripMarkers = [];
    tripPolylines = [];
}

// ================================================================
//  KEYBOARD SHORTCUT: Ctrl+Enter untuk load
// ================================================================
document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        loadHistory();
    }
});

// ================================================================
//  INIT
// ================================================================
document.addEventListener('DOMContentLoaded', () => {
    setDefaultDates();
    loadDevices();
    initMap();

    console.log('🚀 Fleet Tracker History — Supabase Ready');
    console.log('📡 Supabase URL:', SUPABASE_URL);
});
</script>
</body>
</html>
